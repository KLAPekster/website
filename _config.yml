# Instellingen van klapekster.be. Plan: ontwerp/website/PLAN.md in de app-repo.

title: KLAPekster
# De slagzin achter de naam in de titel van de voorpagina (tabblad, Google).
tagline: Zeg wat je ziet. KLAPekster schrijft het op.
# De zoektekst: wat Google onder de titel toont, en WhatsApp bij een gedeelde
# link. Met "vogels" en "app" erin, zodat wie die zoekt de site vindt en niet
# alleen de vogel (10 oktober 2026).
description: >-
  Gratis Android-app voor vogelaars: spreek je vogelwaarnemingen in en
  KLAPekster noteert soort, aantal en gedrag. Export naar waarnemingen.be en
  waarneming.nl.
lang: nl_BE

# Waar de site staat: op klapekster.be sinds 10 oktober 2026 (stap 5). Het
# bestand CNAME zegt GitHub dat het domein bij deze site hoort; het oude
# adres klapekster.github.io/website stuurt vanzelf door.
url: https://klapekster.be
baseurl: ""

# De schakelaar: "test" zolang je je moet aanmelden om de app te proberen,
# "winkel" zodra ze vrij in Google Play staat. Knop, voettekst en de aanhef
# van de aanmeldpagina lezen alleen deze regel. (Het woord "test" staat
# alleen hier; op de site zelf heet het "proberen".)
fase: test

play_id: be.klapekster.app
contact: klapekster.app@gmail.com
aanmeldlink: https://play.google.com/apps/testing/be.klapekster.app

# Het Apps Script dat de aanmeldingen ontvangt (tools/sheets_apps_script.gs in
# de app-repo). Hetzelfde adres als het logboek van de app.
script_url: https://script.google.com/macros/s/AKfycbxUNp1Q1ydU7EVOfJEJfJlVYX8P8BaRBvDVdCdNVfdNWIMWLldtfKS2AtfzAW4wOd4AxA/exec

# Bewijs voor Google Search Console dat de site van ons is (10 oktober 2026).
# Niet weghalen, anders vervalt dat bewijs.
webmaster_verifications:
  google: Oqb8KQQCqoU4SZNTwXus6LE5dqimS0HM7n0X7XoirFs

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
    values:
      layout: standaard
      # Wat WhatsApp en dergelijke tonen als iemand een link doorstuurt.
      image: /assets/beeld/deelbeeld.jpg

exclude:
  - README.md
